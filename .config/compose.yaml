name: guesant-profile
services:
  generator:
    build:
      context: ..
      dockerfile: .config/Dockerfile
    working_dir: /workspace/.config
    volumes:
      - ..:/workspace
      - dependencies:/workspace/.config/node_modules
      - ../../links:/sources/lobby:ro
      - ../../resume:/sources/resume:ro
    environment:
      PROFILE_LOBBY_DIR: ${PROFILE_LOBBY_DIR:-}
      PROFILE_RESUME_DIR: ${PROFILE_RESUME_DIR:-}
    init: true
volumes:
  dependencies:
