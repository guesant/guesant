name: Update generated profile

on:
  schedule:
    - cron: '13 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generated-profile
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    environment: stats
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check and generate README in Docker
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          docker compose -f .config/compose.yaml run --build --rm test
          docker compose -f .config/compose.yaml run --build --rm generator
      - name: Generate both cards in Docker
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: docker compose -f .config/compose.yaml run --build --rm cards

      - name: Upload generated files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-generated
          path: |
            README.md
            profile/stats.svg
            profile/top-langs.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download generated files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: profile-generated
          path: .

      - name: Publish generated files from Docker
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
        run: docker compose -f .config/compose.yaml run --build --rm publish
