name: Update generated profile

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generated-profile
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check and generate README in Docker
        run: |
          set -eu
          docker compose -f .config/compose.yaml run --build --rm test
          docker compose -f .config/compose.yaml run --build --rm generator
      - name: Generate both cards in Docker
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: docker compose -f .config/compose.yaml run --build --rm cards
      - name: Publish generated files from Docker
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
        run: docker compose -f .config/compose.yaml run --build --rm publish
